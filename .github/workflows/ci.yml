name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU-only PyTorch and project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lint
        run: ruff check src tests scripts app.py
      - name: Notebook is in sync with src/
        run: |
          python scripts/build_colab_notebook.py
          git diff --exit-code notebooks/
      - name: Download TweetEval (official files) for integration tests
        run: python scripts/audit_data.py --out /tmp/data_audit.json > /dev/null
      - name: Tests (unit + CPU integration)
        run: pytest -q
